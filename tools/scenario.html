<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>剧本模式 · 绫季绘境</title>
<link rel="stylesheet" href="../css/design-system.css?v=11">
<script src="nav.js?v=8"></script>
<script src="theme.js?v=5"></script>
<style>
  /* ============================================================
     剧本模式 — 幕 → 场景参数 → Prompt
     Prompt 高亮容器走全局 .prompt-code(与 color-script / prompt-spec /
     art-direction 共享同一套语义配色),本页不再自带颜色映射。
     ============================================================ */
  .page { --page-max: 980px; }
  .subtitle { margin-bottom: var(--s-4); }

  /* Header controls */
  .viewer-header-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: var(--s-3); margin-bottom: var(--s-4); }
  .char-toggle { display: inline-flex; gap: var(--s-2); }
  .char-btn { min-height: 40px; padding: var(--s-2) var(--s-4); border: 1px solid var(--border-soft); border-radius: var(--r-md); background: var(--bg-surface); color: var(--text-secondary); cursor: pointer; font: 600 var(--fs-body) var(--font-sans); transition: border-color var(--t-fast), background var(--t-fast), color var(--t-fast); }
  .char-btn:hover { border-color: var(--accent); color: var(--accent); }
  .char-btn:active { transform: scale(.985); }
  .char-btn.active { border-color: var(--accent); background: var(--accent-soft); color: var(--text-primary); box-shadow: var(--glow-sm); }

  /* Scenario list */
  .scenario-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: var(--s-3); margin-bottom: var(--s-6); }
  .scenario-card { padding: var(--s-4); border: 1px solid var(--border-soft); border-radius: var(--r-lg); background: var(--bg-surface); cursor: pointer; transition: border-color var(--t-fast), transform var(--t-fast), box-shadow var(--t-fast); }
  .scenario-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .scenario-card.active { border-color: var(--accent); background: var(--accent-soft); }
  .scenario-icon { margin-bottom: var(--s-2); font-size: var(--fs-title); }
  .scenario-name { margin-bottom: var(--s-1); font-size: var(--fs-title-xs); font-weight: 700; }
  .scenario-en { margin-bottom: var(--s-2); color: var(--text-muted); font-family: var(--font-mono); font-size: var(--fs-label-sm); }
  .scenario-desc { color: var(--text-secondary); font-size: var(--fs-body-sm); }
  .scenario-count { margin-top: var(--s-2); color: var(--accent); font-size: var(--fs-label-xs); }

  /* Viewer */
  .viewer { display: none; margin-bottom: var(--s-5); padding: var(--s-5); border: 1px solid var(--border-soft); border-radius: var(--r-xl); background: var(--bg-deep); }
  .viewer.show { display: block; animation: fadeIn var(--t-base) var(--ease-out); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .viewer-h2 { margin-bottom: var(--s-1); font-size: var(--fs-title); font-weight: 700; }
  .viewer-en { color: var(--text-muted); font-family: var(--font-mono); font-size: var(--fs-body-sm); }

  /* Act */
  .act { margin-bottom: var(--s-3); padding: var(--s-4); border: 1px solid var(--border-soft); border-radius: var(--r-lg); background: var(--bg-surface); }
  .act-head { display: flex; align-items: baseline; gap: var(--s-3); margin-bottom: var(--s-2); flex-wrap: wrap; }
  .act-num { padding: 3px var(--s-3); border-radius: var(--r-pill); background: var(--accent-soft); color: var(--accent); font: 700 var(--fs-body-sm) var(--font-mono); }
  .act-title { font-size: var(--fs-title-xs); font-weight: 700; }
  .act-en { margin-bottom: var(--s-2); color: var(--text-muted); font-family: var(--font-mono); font-size: var(--fs-label); }
  .act-desc { margin-bottom: var(--s-3); color: var(--text-secondary); font-size: var(--fs-body-sm); font-style: italic; }

  /* Scene grid */
  .scene-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: var(--s-2); margin-bottom: var(--s-3); }
  .scene-meta { padding: var(--s-2) var(--s-3); border-radius: var(--r-md); background: var(--bg-elevated); text-align: center; }
  .scene-meta .label { color: var(--text-muted); font-size: var(--fs-mono-sm); letter-spacing: .05em; text-transform: uppercase; }
  .scene-meta .value { margin-top: 2px; color: var(--accent); font-size: var(--fs-body-sm); font-weight: 600; }
  /* 锁定参数串较长,单独降一档避免换行挤压卡片 */
  .scene-meta .value-dense { font-size: var(--fs-label-xs); }
  .lock-badge { display: inline-flex; align-items: center; gap: var(--s-1); padding: 2px var(--s-2); border-radius: var(--r-pill); background: color-mix(in srgb, var(--success) 10%, transparent); color: var(--success-text); font-size: var(--fs-mono-sm); font-weight: 600; }

  /* Prompt (strict module order, each line = one module) */
  .prompt-label { margin-bottom: var(--s-1); color: var(--accent); font-size: var(--fs-label-sm); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  .prompt-label-neg { color: var(--danger-text); }
  .prompt-code { margin-bottom: var(--s-3); }

  .neg-output { padding: var(--s-3); border: 1px solid color-mix(in srgb, var(--danger) 20%, transparent); border-radius: var(--r-md); background: color-mix(in srgb, var(--danger) 4%, transparent); color: var(--danger-text); font: 400 var(--fs-label-sm)/1.8 var(--font-mono); white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; }
  .neg-section { margin-top: var(--s-3); padding-top: var(--s-3); border-top: 1px solid var(--border-soft); }
  .neg-layer { margin-bottom: var(--s-2); }
  .neg-layer-label { margin-bottom: 2px; color: var(--text-muted); font-size: var(--fs-label-xs); font-weight: 600; }

  .art-warn { display: none; align-items: center; gap: var(--s-2); margin-bottom: var(--s-3); padding: var(--s-2) var(--s-3); border: 1px solid var(--warning); border-radius: var(--r-md); background: color-mix(in srgb, var(--warning) 12%, transparent); color: var(--warning-text); font-size: var(--fs-label); font-weight: 500; }
  .art-warn.show { display: flex; }

  .res-rec { display: flex; align-items: flex-start; gap: var(--s-2); flex-wrap: wrap; margin-bottom: var(--s-3); padding: var(--s-2) var(--s-3); border: 1px solid var(--accent); border-radius: var(--r-md); background: var(--accent-soft); color: var(--text-primary); font-size: var(--fs-body-sm); }
  .res-rec strong { color: var(--accent); }
  .res-icon { flex-shrink: 0; }

  .act-actions { display: flex; gap: var(--s-2); flex-wrap: wrap; margin-top: var(--s-3); }

  .info-callout { margin-bottom: var(--s-5); padding: var(--s-3) var(--s-4); border: 1px solid var(--accent); border-radius: var(--r-md); background: var(--accent-soft); color: var(--text-primary); font-size: var(--fs-body-sm); }
  .info-callout strong { color: var(--accent); }

  @media (max-width: 768px) {
    .viewer-header-row { flex-direction: column; align-items: flex-start; }
    .page { padding: var(--s-4) var(--s-3); }
  }
</style>
</head>

<article class="page">
  <a href="../index.html" class="nav-back">← 回首页</a>
  <div class="page-kicker">Scenario mode</div>
  <h1 class="title">🎞 剧本模式</h1>
  <p class="subtitle">把一个故事拆成多幕 CG；每一幕都包含完整的场景结构、美术自检与分层负面提示词。</p>

  <div class="info-callout">
    <strong>🎯 设计理念</strong> &nbsp;|&nbsp; 每一幕都是一个完整场景。切换右上角角色后，全部分幕的提示词会在宁宁与夏目之间同步转换。
    你可以先浏览剧本找灵感，再到开始绘制完成具体画面；当前灵感场景共有 <strong id="sceneCount">--</strong> 个。
  </div>

  <div class="scenario-list" id="scenarioList"></div>

  <div class="viewer" id="viewer">
    <div class="viewer-header-row">
      <div>
        <h2 class="viewer-h2" id="viewerTitle"></h2>
        <div class="viewer-en" id="viewerEn"></div>
      </div>
      <div class="char-toggle">
        <button class="char-btn active" data-char="nene" data-action="switch-char" data-char="nene">🌸 宁宁</button>
        <button class="char-btn" data-char="natsume" data-action="switch-char" data-char="natsume">🍂 夏目</button>
      </div>
    </div>
    <p class="viewer-desc" id="viewerDesc"></p>
    <div class="acts" id="acts"></div>
    <button class="btn btn-ghost" type="button" data-action="back-to-list">← 返回剧本列表</button>
  </div>
</article>

<footer class="footer">
  <p>绫季绘境 · From Story to Scene</p>
  <p class="muted mt-4">剧本模式 · 每一幕都是一个 SC0001 Scene 规范</p>
</footer>

</body>

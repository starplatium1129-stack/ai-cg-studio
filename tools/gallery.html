<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作品册 · 绫季绘境</title>
<link rel="stylesheet" href="../css/design-system.css?v=8">
<script src="nav.js?v=6"></script>
<script src="theme.js?v=5"></script>
<style>
  body { background:linear-gradient(180deg,color-mix(in srgb,var(--bg-page) 94%,var(--accent-soft)),var(--bg-page) 34rem); }
  .gallery-shell { width:min(1880px,100%); margin:0 auto; padding:clamp(24px,4vw,64px) clamp(14px,3vw,48px) 80px; }
  .gallery-intro { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:end; gap:var(--s-5); margin:0 auto clamp(24px,4vw,48px); max-width:1500px; }
  .gallery-kicker { margin-bottom:8px; color:var(--accent); font:750 .67rem var(--font-mono); letter-spacing:.16em; text-transform:uppercase; }
  .gallery-title { margin:0; color:var(--text-primary); font-size:clamp(2rem,4vw,4.4rem); font-weight:760; letter-spacing:-.045em; line-height:.98; }
  .gallery-subtitle { max-width:660px; margin:14px 0 0; color:var(--text-secondary); font-size:clamp(.86rem,1.2vw,1rem); line-height:1.8; }
  .gallery-count { color:var(--text-muted); font:650 .72rem var(--font-mono); letter-spacing:.08em; white-space:nowrap; }

  .gallery-toolbar { position:sticky; top:58px; z-index:20; display:flex; align-items:center; gap:10px; max-width:1500px; margin:0 auto clamp(24px,3vw,38px); padding:10px; border:1px solid color-mix(in srgb,var(--border-soft) 76%,transparent); border-radius:999px; background:color-mix(in srgb,var(--bg-surface) 84%,transparent); box-shadow:0 12px 38px color-mix(in srgb,var(--text-primary) 7%,transparent); backdrop-filter:blur(18px); }
  .gallery-filter,.gallery-project { height:36px; border:1px solid transparent; border-radius:999px; background:transparent; color:var(--text-secondary); font:650 .76rem var(--font-sans); cursor:pointer; }
  .gallery-filter { padding:0 15px; }
  .gallery-filter:hover,.gallery-filter.active { border-color:color-mix(in srgb,var(--accent) 34%,var(--border-soft)); background:var(--accent-soft); color:var(--accent); }
  .gallery-project { min-width:140px; padding:0 34px 0 13px; outline:none; }
  .gallery-project:focus { border-color:var(--accent); }
  .gallery-toolbar-note { margin-left:auto; padding-right:12px; color:var(--text-muted); font-size:.7rem; white-space:nowrap; }

  .gallery-wall { max-width:1500px; margin:0 auto; columns:4 260px; column-gap:clamp(12px,1.6vw,24px); }
  .artwork { position:relative; break-inside:avoid; margin:0 0 clamp(12px,1.6vw,24px); overflow:hidden; border:1px solid color-mix(in srgb,var(--border-soft) 78%,transparent); border-radius:clamp(10px,1.2vw,18px); background:#111015; box-shadow:0 5px 18px color-mix(in srgb,#000 11%,transparent); transition:transform 220ms ease,box-shadow 220ms ease,border-color 220ms ease; }
  .artwork:hover { transform:translateY(-3px); border-color:color-mix(in srgb,var(--accent) 38%,var(--border-soft)); box-shadow:0 18px 44px color-mix(in srgb,#000 20%,transparent); }
  .artwork-button { display:block; width:100%; padding:0; border:0; background:transparent; color:inherit; cursor:zoom-in; }
  .artwork-button:focus-visible { outline:3px solid var(--accent); outline-offset:-3px; }
  .artwork-media { position:relative; width:100%; aspect-ratio:var(--art-ratio,3/4); overflow:hidden; background:linear-gradient(135deg,#17141c,#0c0b0f); }
  .artwork-image { display:block; width:100%; height:100%; object-fit:contain; background:#0d0c10; }
  .artwork-placeholder { position:absolute; inset:0; display:grid; place-items:center; color:#77717f; font-size:2rem; }
  .artwork-caption { position:absolute; inset:auto 0 0; display:flex; align-items:flex-end; justify-content:space-between; gap:12px; padding:40px 14px 13px; color:#fff; background:linear-gradient(transparent,rgba(4,3,6,.78)); opacity:0; transform:translateY(8px); transition:opacity 180ms ease,transform 180ms ease; text-align:left; pointer-events:none; }
  .artwork:hover .artwork-caption,.artwork-button:focus-visible .artwork-caption { opacity:1; transform:none; }
  .artwork-name { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:.78rem; font-weight:700; }
  .artwork-date { display:block; margin-top:2px; color:rgba(255,255,255,.7); font-size:.62rem; }
  .artwork-mark { flex:0 0 auto; font-size:.78rem; }

  .gallery-section { column-span:all; display:flex; align-items:center; gap:14px; margin:12px 0 18px; color:var(--text-muted); font:700 .64rem var(--font-mono); letter-spacing:.13em; text-transform:uppercase; }
  .gallery-section::after { content:""; height:1px; flex:1; background:var(--border-soft); }
  .gallery-empty { max-width:980px; margin:10vh auto 0; padding:clamp(42px,8vw,92px) 24px; border:1px solid var(--border-soft); border-radius:24px; background:color-mix(in srgb,var(--bg-surface) 80%,transparent); text-align:center; }
  .gallery-empty-icon { font-size:2.4rem; }
  .gallery-empty h2 { margin:18px 0 8px; color:var(--text-primary); font-size:clamp(1.3rem,3vw,2rem); }
  .gallery-empty p { max-width:600px; margin:0 auto 24px; color:var(--text-secondary); line-height:1.8; }

  .art-viewer { position:fixed; inset:0; z-index:10000; display:grid; grid-template-columns:minmax(0,1fr) minmax(290px,360px); background:rgba(6,5,8,.97); color:#fff; opacity:0; visibility:hidden; transition:opacity 180ms ease,visibility 180ms ease; }
  .art-viewer.open { opacity:1; visibility:visible; }
  .viewer-stage { position:relative; min-width:0; display:grid; place-items:center; padding:clamp(46px,5vw,76px) clamp(48px,6vw,92px); overflow:hidden; }
  .viewer-image { display:block; max-width:100%; max-height:calc(100vh - 92px); width:auto; height:auto; object-fit:contain; filter:drop-shadow(0 24px 56px rgba(0,0,0,.42)); }
  .viewer-fallback { color:#87818d; font-size:3rem; }
  .viewer-close,.viewer-nav,.viewer-info-toggle { position:absolute; z-index:3; display:grid; place-items:center; border:1px solid rgba(255,255,255,.16); background:rgba(18,16,22,.72); color:#fff; cursor:pointer; backdrop-filter:blur(12px); transition:background 160ms ease,transform 160ms ease; }
  .viewer-close,.viewer-info-toggle { top:18px; width:40px; height:40px; border-radius:50%; }
  .viewer-close { left:18px; font-size:1.2rem; }
  .viewer-info-toggle { right:18px; display:none; }
  .viewer-nav { top:50%; width:44px; height:64px; border-radius:999px; transform:translateY(-50%); font-size:1.5rem; }
  .viewer-nav:hover,.viewer-close:hover,.viewer-info-toggle:hover { background:rgba(181,58,112,.72); }
  .viewer-prev { left:16px; }
  .viewer-next { right:16px; }
  .viewer-nav:disabled { opacity:.24; cursor:default; }
  .viewer-position { position:absolute; left:50%; bottom:18px; transform:translateX(-50%); color:rgba(255,255,255,.62); font:650 .65rem var(--font-mono); letter-spacing:.12em; }
  .viewer-info { min-width:0; overflow-y:auto; padding:56px 28px 32px; border-left:1px solid rgba(255,255,255,.1); background:rgba(16,14,19,.9); }
  .viewer-kicker { color:#d885aa; font:700 .62rem var(--font-mono); letter-spacing:.13em; text-transform:uppercase; }
  .viewer-title { margin:10px 0 6px; color:#fff; font-size:1.5rem; line-height:1.25; }
  .viewer-meta { color:rgba(255,255,255,.55); font-size:.72rem; line-height:1.6; }
  .viewer-story { margin:26px 0; color:rgba(255,255,255,.8); font-size:.88rem; font-style:italic; line-height:1.8; }
  .viewer-facts { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:24px; }
  .viewer-fact { min-width:0; padding:10px; border:1px solid rgba(255,255,255,.1); border-radius:10px; background:rgba(255,255,255,.035); }
  .viewer-fact small,.viewer-fact strong { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .viewer-fact small { color:rgba(255,255,255,.4); font-size:.58rem; text-transform:uppercase; letter-spacing:.08em; }
  .viewer-fact strong { margin-top:4px; color:rgba(255,255,255,.84); font-size:.72rem; }
  .viewer-details { margin:0 0 22px; border-top:1px solid rgba(255,255,255,.1); }
  .viewer-details summary { padding:14px 0; color:rgba(255,255,255,.7); font-size:.72rem; cursor:pointer; }
  .viewer-prompt { max-height:220px; overflow:auto; padding:12px; border-radius:10px; background:#0b0a0d; color:rgba(255,255,255,.66); font:400 .68rem/1.65 var(--font-mono); white-space:pre-wrap; word-break:break-word; }
  .viewer-actions { display:grid; gap:8px; }
  .viewer-actions .btn { justify-content:center; }
  body.viewer-open { overflow:hidden; }

  @media (max-width:900px) {
    .gallery-intro { grid-template-columns:1fr; }
    .gallery-count { display:none; }
    .art-viewer { grid-template-columns:1fr; }
    .viewer-stage { padding:60px 42px 78px; }
    .viewer-info { position:absolute; inset:0 0 0 auto; width:min(86vw,360px); transform:translateX(100%); border-left:1px solid rgba(255,255,255,.1); transition:transform 190ms ease; z-index:4; }
    .art-viewer.info-open .viewer-info { transform:none; }
    .viewer-info-toggle { display:grid; }
  }
  @media (max-width:600px) {
    .gallery-shell { padding:22px 10px 64px; }
    .gallery-intro { padding:0 6px; }
    .gallery-toolbar { top:52px; border-radius:16px; flex-wrap:wrap; }
    .gallery-toolbar-note { display:none; }
    .gallery-project { flex:1; min-width:110px; }
    .gallery-wall { columns:2 135px; column-gap:10px; }
    .artwork { margin-bottom:10px; border-radius:9px; }
    .artwork-caption { opacity:1; transform:none; padding:34px 9px 8px; }
    .artwork-name { font-size:.67rem; }
    .artwork-date { display:none; }
    .viewer-stage { padding:58px 38px 76px; }
    .viewer-nav { width:36px; height:56px; }
    .viewer-prev { left:8px; }
    .viewer-next { right:8px; }
  }
  @media (prefers-reduced-motion:reduce) {
    .artwork,.artwork-caption,.art-viewer,.viewer-info { transition:none !important; }
  }
</style>
</head>
<body data-nav="gallery">
<nav class="nav"><div class="nav-inner"><div class="nav-brand"><span class="dot"></span> 绫季绘境</div><div class="nav-links"></div></div></nav>

<main class="gallery-shell">
  <header class="gallery-intro">
    <div>
      <div class="gallery-kicker">Private collection</div>
      <h1 class="gallery-title">作品册</h1>
      <p class="gallery-subtitle">让画面保持它原本的方向与比例。这里先看作品，创作参数只在需要时出现。</p>
    </div>
    <div class="gallery-count" id="galleryCount">正在整理展墙…</div>
  </header>
  <div class="gallery-toolbar" id="galleryToolbar" aria-label="作品筛选"></div>
  <section id="gallery" aria-live="polite"></section>
</main>

<div class="art-viewer" id="artViewer" role="dialog" aria-modal="true" aria-hidden="true" aria-label="作品观赏模式">
  <section class="viewer-stage" id="viewerStage">
    <button class="viewer-close" type="button" data-viewer-action="close" aria-label="关闭">×</button>
    <button class="viewer-nav viewer-prev" type="button" data-viewer-action="prev" aria-label="上一幅">‹</button>
    <div id="viewerImageSlot" class="viewer-fallback">✦</div>
    <button class="viewer-nav viewer-next" type="button" data-viewer-action="next" aria-label="下一幅">›</button>
    <button class="viewer-info-toggle" type="button" data-viewer-action="info" aria-label="作品信息">i</button>
    <div class="viewer-position" id="viewerPosition"></div>
  </section>
  <aside class="viewer-info" id="viewerInfo"></aside>
</div>

<footer class="footer"><p>绫季绘境 · From Story to Scene</p></footer>
<script src="image-store.js?v=5"></script>
<script src="gallery.js?v=1"></script>
</body>
</html>

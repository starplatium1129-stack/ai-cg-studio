<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灵感场景 · 绫季绘境</title>
<link rel="stylesheet" href="../css/design-system.css?v=8">
<link rel="stylesheet" href="../css/scene-card.css?v=7">
<script src="nav.js?v=7"></script>
<script src="scene-card.js?v=8"></script>
<script src="scene-ux.js?v=2"></script>
<script src="quick-create.js?v=1"></script>
<script src="image-store.js?v=5"></script>

<style>
  .page { width:100%; min-width:0; max-width:1100px; margin:0 auto; padding:var(--s-5) var(--s-4); }
  .nav-back { display: inline-flex; align-items: center; gap: var(--s-2); color: var(--text-secondary); font-size: 0.9rem; margin-bottom: var(--s-4); }
  .nav-back:hover { color: var(--accent); }
  h1.title { font-size: 2rem; font-weight: 800; background: linear-gradient(135deg, var(--text-primary) 50%, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: var(--s-2); }
  .subtitle { color: var(--text-secondary); margin-bottom: var(--s-6); font-size: 1.05rem; }

  .curation-panel { display:grid; grid-template-columns:minmax(220px,.9fr) 2fr; gap:var(--s-4); margin:-10px 0 var(--s-5); padding:var(--s-4); border:1px solid var(--border-soft); border-radius:var(--r-xl); background:linear-gradient(120deg,var(--accent-soft),transparent 62%),var(--bg-surface); box-shadow:var(--shadow-sm); backdrop-filter:blur(20px) saturate(130%); }
  .curation-intro { display:flex; flex-direction:column; justify-content:center; }
  .curation-kicker { color:var(--accent); font-size:.7rem; font-weight:800; letter-spacing:.14em; text-transform:uppercase; }
  .curation-intro h2 { margin:4px 0 2px; font-size:1.15rem; }
  .curation-intro p { margin:0; color:var(--text-muted); font-size:.8rem; line-height:1.6; }
  .mood-rails { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:var(--s-2); }
  .mood-rail { position:relative; overflow:hidden; min-height:96px; padding:var(--s-3); border:1px solid var(--border-soft); border-radius:var(--r-lg); color:var(--text-primary); text-align:left; background:var(--bg-elevated); cursor:pointer; transition:transform var(--t-fast),border-color var(--t-fast),box-shadow var(--t-fast); }
  .mood-rail::after { content:''; position:absolute; inset:auto -22px -42px auto; width:100px; height:100px; border-radius:50%; opacity:.5; filter:blur(3px); background:var(--accent-glow); }
  .mood-rail.nene { background:linear-gradient(135deg,rgba(184,149,255,.20),rgba(255,181,219,.08)),var(--bg-elevated); }
  .mood-rail.natsume { background:linear-gradient(135deg,rgba(242,187,104,.20),rgba(91,56,59,.12)),var(--bg-elevated); }
  .mood-rail:hover { transform:translateY(-3px); border-color:var(--accent); box-shadow:var(--shadow-sm); }
  .mood-rail .mood-icon { display:block; font-size:1.25rem; margin-bottom:4px; }
  .mood-rail strong { display:block; font-size:.85rem; }
  .mood-rail small { color:var(--text-muted); font-size:.7rem; }
  .scene-fav { width:100%; justify-content:center; margin-top:var(--s-2); border-color:var(--border-soft); background:transparent; color:var(--text-muted); }
  .scene-fav.saved { color:var(--accent); border-color:var(--accent); background:var(--accent-soft); }

  /* Search + cats */
  .scene-search-wrap { position: relative; margin-bottom: var(--s-4); }
  .scene-search { width: 100%; padding: var(--s-3) 42px var(--s-3) var(--s-4); background: var(--bg-deep); border: 1px solid var(--border-soft); border-radius: var(--r-lg); color: var(--text-primary); font-size: 0.95rem; outline: none; transition: border-color var(--t-fast); }
  .scene-search:focus { border-color: var(--accent); }
  .scene-search::placeholder { color: var(--text-muted); }
  .scene-search-clear { position:absolute; top:50%; right:9px; transform:translateY(-50%); width:28px; height:28px; border:0; border-radius:50%; background:transparent; color:var(--text-muted); cursor:pointer; font-size:1rem; }
  .scene-search-clear:hover { color:var(--accent); background:var(--accent-soft); }
  .search-intent { min-height:22px; margin:-10px 4px var(--s-3); color:var(--text-muted); font-size:.76rem; }
  .search-intent strong { color:var(--accent); }
  .scene-toolbar { display: grid; gap: var(--s-3); margin-bottom: var(--s-5); }
  .scene-filter-label { font-size: .72rem; color: var(--text-muted); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: var(--s-2); }
  .scene-cats { display: flex; flex-wrap: wrap; gap: var(--s-2); }
  .scene-cat { appearance: none; padding: 6px 16px; border: 1px solid var(--border-soft); background: var(--bg-surface); color: var(--text-secondary); border-radius: 20px; cursor: pointer; font: 500 .85rem var(--font-sans); transition: all var(--t-fast); }
  .scene-cat:hover { border-color: var(--accent); color: var(--accent); }
  .scene-cat.active { background: var(--accent); color: var(--text-inverse); border-color: var(--accent); }
  .scene-facet-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:var(--s-3); }
  .scene-filter-field { display:grid; gap:5px; color:var(--text-muted); font-size:.72rem; font-weight:600; }
  .scene-filter-field select { width:100%; min-width:0; padding:8px 10px; background:var(--bg-deep); border:1px solid var(--border-soft); border-radius:var(--r-md); color:var(--text-primary); font:500 .82rem var(--font-sans); outline:none; }
  .scene-filter-field select:focus { border-color:var(--accent); }
  .scene-more-filters { border:1px solid var(--border-soft); border-radius:var(--r-md); background:var(--bg-surface); overflow:hidden; }
  .scene-more-filters summary { list-style:none; display:flex; align-items:center; justify-content:space-between; gap:var(--s-3); padding:10px 12px; color:var(--text-secondary); cursor:pointer; font-size:.8rem; font-weight:650; }
  .scene-more-filters summary::-webkit-details-marker { display:none; }
  .scene-more-filters summary:hover { color:var(--text-primary); background:var(--accent-soft); }
  .scene-more-filters summary::after { content:'＋'; color:var(--text-muted); }
  .scene-more-filters[open] summary::after { content:'−'; }
  .scene-more-filters .scene-facet-grid { padding:0 12px 12px; grid-template-columns:repeat(4,minmax(0,1fr)); }
  .scene-filter-meta { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); flex-wrap: wrap; padding: var(--s-3); border: 1px solid var(--border-soft); border-radius: var(--r-md); background: var(--bg-surface); }
  .mature-toggle { display: inline-flex; align-items: center; gap: var(--s-2); color: var(--text-secondary); cursor: pointer; font-size: .85rem; }
  .mature-toggle input { accent-color: var(--accent); width: 17px; height: 17px; }
  .scene-count { color: var(--text-secondary); font-size: .82rem; }
  .scene-count strong { color: var(--accent); }
  .scene-reset { border:0; background:transparent; color:var(--text-muted); cursor:pointer; font:600 .78rem var(--font-sans); }
  .scene-reset:hover { color:var(--accent); }

  /* Grid */
  .scene-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--s-4); }
  .scene-load { display: flex; justify-content: center; margin-top: var(--s-5); }
  .scene-load[hidden] { display: none; }

  /* Explorer 卡只保留创作判断，技术标签交给导演台。 */
  .ex-scene-line { display:flex; align-items:center; flex-wrap:wrap; gap:5px; margin:0 0 var(--s-2); color:var(--text-muted); font-size:.69rem; }
  .ex-scene-line strong { color:var(--accent); font-weight:750; }
  .ex-scene-line span + span::before { content:'·'; margin-right:5px; color:var(--border-strong); }
  .ex-decision { display:flex; align-items:center; flex-wrap:wrap; gap:7px; margin:0 0 var(--s-3); padding:8px 10px; border:1px solid var(--border-soft); border-radius:var(--r-md); background:var(--bg-deep); color:var(--text-secondary); font-size:.7rem; }
  .ex-decision::before { content:'DIRECTOR'; color:var(--text-muted); font:750 .56rem var(--font-mono); letter-spacing:.1em; }
  .ex-decision span + span::before { content:'／'; margin-right:7px; color:var(--border-strong); }
  .ex-decision strong { color:var(--text-primary); font-weight:650; }
  .ex-curation { display:flex; align-items:flex-start; gap:8px; margin:0 0 var(--s-3); padding:8px 10px; border-radius:var(--r-md); background:linear-gradient(120deg,var(--accent-soft),transparent); color:var(--text-secondary); font-size:.74rem; line-height:1.55; }
  .ex-tier { flex:0 0 auto; padding:1px 7px; border:1px solid var(--accent); border-radius:999px; color:var(--accent); font-size:.65rem; font-weight:800; }
  .ex-tier.signature { color:var(--natsume-amber); border-color:var(--natsume-amber); }
  .ex-actions { display: flex; gap: var(--s-2); }
  .ex-actions .btn { flex: 1; padding: var(--s-2); font-size: 0.82rem; }
  .ex-actions .btn-primary { font-weight: 700; }
  .scene-flash { outline: 3px solid var(--accent); outline-offset: 4px; transition: outline-color .3s; }

  /* Story drawer (in-page modal) */
  .story-drawer { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 100; padding: var(--s-4); }
  .story-drawer.open { display: flex; }
  .story-card { background: var(--bg-surface); border: 1px solid var(--accent); border-radius: var(--r-xl); max-width: 480px; width: 100%; padding: var(--s-5); box-shadow: var(--shadow-lg); }
  .story-card h3 { font-size: 1.3rem; font-weight: 800; margin-bottom: var(--s-2); color: var(--text-primary); }
  .story-card .story-meta { font-size: 0.78rem; color: var(--text-muted); margin-bottom: var(--s-3); }
  .story-card .story-body { font-size: 0.95rem; line-height: 1.7; color: var(--text-secondary); margin-bottom: var(--s-4); }
  .story-card .story-actions { display: flex; gap: var(--s-2); }
  .story-card .story-actions .btn { flex: 1; }

  @media (max-width: 768px) {
    .scene-grid { min-width:0; grid-template-columns:minmax(0,1fr); }
    .scene-grid > .sc { content-visibility:auto; contain-intrinsic-size:auto 420px; }
    .page { padding: var(--s-4) var(--s-3); }
    .ex-decision { display: none; }
    .scene-facet-grid { grid-template-columns:1fr 1fr; }
    .scene-more-filters .scene-facet-grid { grid-template-columns:1fr 1fr; }
    .curation-panel { grid-template-columns:1fr; }
    .mood-rails { display:flex; max-width:100%; overflow-x:auto; padding-bottom:3px; scroll-snap-type:x proximity; }
    .mood-rail { flex:0 0 min(230px,82vw); scroll-snap-align:start; }
    .scene-toolbar > * { min-width:0; }
    .scene-cats { width:100%; max-width:100%; flex-wrap:nowrap; overflow-x:auto; padding-bottom:4px; }
    .scene-cat { flex:none; }
    .scene-cat, .scene-reset, .scene-filter select, .scene-search-clear, .ex-actions .btn, .story-actions .btn { min-height: 44px; }
    .scene-card .scene-story { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
    .ex-actions { margin-top: var(--s-3); }
  }
  @media (max-width: 420px) {
    .scene-facet-grid { grid-template-columns:1fr; }
    .mood-rails { grid-template-columns:none; }
  }
</style>
</head>
<body data-nav="scene">

<nav class="nav">
  <div class="nav-inner">
    <div class="nav-brand"><span class="dot"></span> 绫季绘境</div>
    <div class="nav-links">
    </div>
  </div>
</nav>

<article class="page">
  <a href="../index.html" class="nav-back">← 回首页</a>

  <h1 class="title">🌸 灵感场景</h1>
  <p class="subtitle">宁宁的月光秘密，夏目的夜灯关心。这里整理了 <strong id="sceneTotal">正在整理的场景</strong>，优先给你真正值得开画的瞬间。</p>

  <section class="curation-panel" aria-label="场景灵感精选">
    <div class="curation-intro"><span class="curation-kicker">Nene × Natsume</span><h2>从角色的心情，走进场景</h2><p>宁宁的柔软慌乱、夏目的克制关心，才是灵感场景真正的索引。</p></div>
    <div class="mood-rails" id="moodRails" aria-live="polite"></div>
  </section>

  <label class="sr-only" for="sceneSearch">搜索场景</label>
  <div class="scene-search-wrap">
    <input type="search" class="scene-search" placeholder="🔍 试试：心动、安静、宁宁经典感、夏目经典感" id="sceneSearch" data-filter="scenes">
    <button class="scene-search-clear" type="button" data-action="clear-search" aria-label="清空场景搜索" title="清空搜索">×</button>
  </div>
  <div class="search-intent" id="sceneSearchIntent" aria-live="polite"></div>
  <div class="scene-toolbar">
    <div>
      <div class="scene-filter-label">主题</div>
      <div class="scene-cats" id="sceneCats" aria-label="按主题筛选"></div>
    </div>
    <div class="scene-facet-grid">
      <label class="scene-filter-field">角色<select id="sceneCharacter" data-filter="scenes"><option value="all">全部角色</option><option value="nene">🌸 宁宁</option><option value="natsume">🍂 夏目</option><option value="triad">🌸🍂 双人</option></select></label>
      <label class="scene-filter-field">季节<select id="sceneSeason" data-filter="scenes"><option value="all">全部季节</option><option value="春">🌸 春</option><option value="夏">☀️ 夏</option><option value="秋">🍂 秋</option><option value="冬">❄️ 冬</option><option value="不限">不限季节</option></select></label>
      <label class="scene-filter-field">时段<select id="sceneTime" data-filter="scenes"><option value="all">全部时段</option><option value="morning">清晨</option><option value="afternoon">午后</option><option value="sunset">黄昏</option><option value="night">夜晚与深夜</option><option value="dawn">黎明</option></select></label>
    </div>
    <details class="scene-more-filters">
      <summary>更多筛选与排序</summary>
      <div class="scene-facet-grid">
        <label class="scene-filter-field">系列<select id="sceneSeries" data-filter="scenes"><option value="all">全部系列</option><option value="after">After Story</option><option value="fanwork">同人</option><option value="active">Active Sync</option></select></label>
        <label class="scene-filter-field">内容分级<select id="sceneRating" data-filter="scenes"><option value="all">全部分级</option><option value="All">全年龄</option><option value="R15">R15 暧昧</option><option value="R18">R18 成人</option></select></label>
        <label class="scene-filter-field">精品层级<select id="sceneTier" data-filter="scenes"><option value="featured">招牌与精选</option><option value="signature">只看招牌</option><option value="curated">只看精选</option><option value="all">完整场景库</option><option value="review">待返工</option></select></label>
        <label class="scene-filter-field">排序<select id="sceneSort" data-filter="scenes"><option value="smart">✨ 智能推荐</option><option value="curated">主理人精选</option><option value="favorite">我的收藏</option><option value="newest">最新加入</option><option value="title">名称 A-Z</option></select></label>
      </div>
    </details>
    <div class="scene-filter-meta">
      <label class="mature-toggle"><input type="checkbox" id="showMature"> 显示成人内容 <span id="matureCount"></span></label>
      <span class="scene-count" id="sceneCount" role="status" aria-live="polite"></span>
      <button class="scene-reset" type="button" data-action="reset-filters">重置全部筛选</button>
    </div>
  </div>
  <div class="scene-grid" id="sceneGrid"></div>
  <div class="scene-load" id="sceneLoad" hidden><button type="button" class="btn btn-ghost" id="loadMoreScenes">加载更多</button></div>
</article>

<!-- Story drawer -->
<div class="story-drawer" id="storyDrawer" data-action="drawer-backdrop">
  <div class="story-card" id="storyCard"></div>
</div>

<footer class="footer">
  <p>绫季绘境 · From Story to Scene</p>
  <p class="muted mt-4" id="sceneFooterCount">灵感场景 · 正在加载</p>
</footer>

<script src="scene-explorer.js?v=2"></script>
</body>
</html>

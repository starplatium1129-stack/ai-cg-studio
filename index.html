<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <script src="/assets/theme-bootstrap.js"></script>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 告诉浏览器两套主题都支持：表单控件/滚动条会跟着走，且首屏不会闪白 -->
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="绘遇 HUIYU · 角色创作与故事画室。让想象成形，让故事相遇。" />
    <title>绘遇 · HUIYU — 让想象成形，让故事相遇</title>
    <!-- SPA 挂载前的首帧占位：避免 bundle 加载期间 #app 一片白。
         占位样式在 src/styles/first-paint.css，以 render-blocking link 引入
         （等价内联 style 的防白屏效果，且规避 Vite 内联 <style> 代理构建 bug）。 -->
    <link rel="stylesheet" href="/src/styles/first-paint.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 告诉浏览器两套主题都支持：表单控件/滚动条会跟着走，且首屏不会闪白 -->
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="绫季绘境 · 个人 Galgame 风格 AI CG 场景工作台：从故事到场景到 prompt 到成片。" />
    <title>绫季绘境 · 把心动的一瞬，画成一张 CG</title>
    <!-- SPA 挂载前的首帧占位：避免 bundle 加载期间 #app 一片白。
         只占一个背景 + 工坊名，Vue 挂载后立即被替换。 -->
    <style>
      #app:empty::before {
        content: "绫季绘境";
        position: fixed; inset: 0;
        display: grid; place-items: center;
        background: #110B22;
        color: #8f8aa8;
        font: 600 13px/1.6 "PingFang SC", "Microsoft YaHei", sans-serif;
        letter-spacing: .34em;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

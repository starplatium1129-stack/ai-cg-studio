<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>wl-live2d 对照页</title>
<style>
  body { margin: 0; background: transparent; }
  #stage { width: 512px; height: 512px; margin: 0 auto; position: relative; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module">
import { wlLive2d } from './vendor/index.js';

const app = wlLive2d({
  selector: '#stage',
  fixed: false,
  drag: false,
  sayHello: false,
  hitFrame: false,
  menus: [],
  tips: {
    talk: false,
    drag: false,
    motionMessage: false,
    message: [],
    talkApis: [],
  },
  transitionTime: 250,
  models: [{
    path: '/assets/live2d/nene/nene.model3.json',
    width: 600,
    height: 600,
    position: { x: 0, y: 0 },
    motionPreload: 'ALL',
  }],
});

window.__app = app;
let loaded = false;
app.onModelLoaded((model) => {
  console.log('model loaded:', model.width, model.height, model.visible);
  loaded = true;
  window.__model = model;
  if (model.motion) {
    model.motion('Idle', 0, 1).then(() => console.log('motion started')).catch(e => console.log('motion err', e));
  }
});
app.onModelError((e) => console.log('model error:', e));

setTimeout(() => {
  console.log('wl-live2d loaded flag:', loaded);
  window.__state = loaded ? 'ready' : 'loading';
}, 6000);
</script>
</body>
</html>

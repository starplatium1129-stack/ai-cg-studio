name: Dependency Audit

# 每周依赖安全扫描（2026-08-28 审计 P1-13：门禁盲区补齐）。
# 运行时依赖仅 12 个，审计面用 --omit=dev 聚焦真实供应链；audit-level=high
# 让中等公告（单人本地部署威胁模型）不打扰主线，高危/致命才告警。
on:
  schedule:
    - cron: '0 3 * * 1' # 每周一 03:00 UTC（北京 11:00）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit full tree (report only)
        run: npm audit --audit-level=high || true # dev 依赖公告只报告，不阻断

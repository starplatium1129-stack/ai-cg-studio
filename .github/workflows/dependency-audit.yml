name: Dependency Audit

# 每周依赖安全扫描（2026-08-28 审计 P1-13：门禁盲区补齐）。
# 运行时与完整依赖树都检查；高危/致命阻断，中危保留在 JSON 证据中。
on:
  schedule:
    - cron: '0 3 * * 1' # 每周一 03:00 UTC（北京 11:00）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install dependencies
        id: install
        run: npm ci
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit full dependency tree
        if: always() && steps.install.outcome == 'success'
        run: npm audit --json --audit-level=high > dependency-audit.json
      - name: Preserve dependency audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-audit
          path: dependency-audit.json
          if-no-files-found: ignore
          retention-days: 14

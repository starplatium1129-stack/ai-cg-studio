name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

# 普通验证按分支／PR 收敛（2026-09-10 复核 O4）：连续提交只保留最新一次完整流水线。
# tag 推送可能对应发布验证，不做自动取消；Windows 原生与定时任务各自独立分组。
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AICS_HYGIENE_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      # 参考媒体按项目契约不入 Git；CI 验证索引结构，本机 gate:full 仍逐文件查验。
      AICS_REFERENCE_AUDIT_MODE: structure
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # 测试直接 require() src/ 下的 .ts（Node 内建类型剥离），需要 22.18+
          node-version: 24.18.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build SPA
        run: npm run build
      - name: Run static and generated-source checks
        run: npm run check
      - name: Run frontend unit tests (coverage thresholds enforced)
        run: npx vitest run --coverage
      - name: Run parallel-safe unit suite
        run: npm run test:unit
      - name: Run controlled contract suite
        run: npm run test:contract
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
      - name: Run browser regression
        run: npm run test:e2e:critical:run
        env:
          CI: '1'
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

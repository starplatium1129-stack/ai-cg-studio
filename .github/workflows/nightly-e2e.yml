name: Nightly visual regression

on:
  schedule:
    # 02:00 Asia/Shanghai; GitHub Actions cron uses UTC.
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-visual-e2e
  cancel-in-progress: false

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build SPA
        run: npm run build
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
      - name: Run full theme audit and screenshot matrix
        run: npm run test:e2e:nightly:run
        env:
          CI: '1'
      - name: Upload visual review screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-visual-review
          path: .review-shots
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

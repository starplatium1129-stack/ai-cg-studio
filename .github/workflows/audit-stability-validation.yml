name: Audit stability validation
on:
  push:
    branches: [codex/huiyu-audit-stability-b18fa1b]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AICS_REFERENCE_AUDIT_MODE: structure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm run build:runtime && npm run scenes:build && npm run popular:build && npm run blueprints:build
      - run: node --test scripts/tests/test-scene-patch.js
      - run: npx eslint scripts/maintenance/apply-scene-patch.js scripts/tests/test-scene-patch.js
      - run: npm run scenes:pin
      - run: npm run test:monolith

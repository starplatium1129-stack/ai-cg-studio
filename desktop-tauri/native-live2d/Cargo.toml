[package]
name = "live2d-native"
version = "0.1.0"
edition = "2021"
description = "Native Live2D runtime: official Cubism SDK for Native 5-r.5 framework (C++) wrapped for Rust, wgpu renderer"

[build-dependencies]
cc = "1"

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "27"
